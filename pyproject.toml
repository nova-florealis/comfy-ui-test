[project]
name = "ComfyUI"
version = "0.3.24"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.11.11",
    "attrs>=25.1.0",
    "av>=14.2.0",
    "chardet>=5.2.0",
    "comfyui-frontend-package>=1.12.6",
    "crewai>=0.1.24",
    "einops>=0.8.0",
    "gitpython>=3.1.44",
    "griptape-black-forest",
    "griptape-serper-driver-extension",
    "griptape[all]>=1.4.0",
    "huggingface-hub>0.20",
    "kornia>=0.7.1",
    "litellm>=1.10.0",
    "markitdown>=0.0.1",
    "matrix-client==0.4.0",
    "numpy>=1.25.0",
    "openai>=1.58.1",
    "pillow>=11.1.0",
    "poetry==1.8.5",
    "psutil>=6.1.1",
    "pygithub>=2.5.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
    "rich>=13.9.4",
    "safetensors>=0.4.2",
    "scipy>=1.13.1",
    "sentencepiece>=0.2.0",
    "soundfile>=0.13.1",
    "spandrel>=0.4.1",
    "tokenizers>=0.13.3",
    "toml>=0.10.2",
    "torch>=2.5.1",
    "torchaudio>=2.5.1",
    "torchsde>=0.2.6",
    "torchvision>=0.20.1",
    "tqdm>=4.67.1",
    "transformers>=4.28.1",
    "typer>=0.15.1",
    "typing-extensions>=4.12.2",
    "uv>=0.5.24",
]

[project.urls]
homepage = "https://www.comfy.org/"
repository = "https://github.com/comfyanonymous/ComfyUI"
documentation = "https://docs.comfy.org/"

[tool.ruff]
lint.select = [
  "S307", # suspicious-eval-usage
  "S102", # exec
  "T",    # print-usage
  "W",
  # The "F" series in Ruff stands for "Pyflakes" rules, which catch various Python syntax errors and undefined names.
  # See all rules here: https://docs.astral.sh/ruff/rules/#pyflakes-f
  "F",
]
exclude = ["*.ipynb"]

[tool.uv.sources]
griptape-black-forest = { git = "https://github.com/griptape-ai/griptape-black-forest.git" }
griptape-serper-driver-extension = { git = "https://github.com/mertdeveci5/griptape-serper-driver-extension.git" }
